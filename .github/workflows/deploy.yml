name: deploy

# On merge to development: build image, roll the dev sensors ECS service.
# Uses GitHub → AWS OIDC. Self-skips until repo vars DEPLOY_ROLE_ARN + AWS_REGION
# are set.

on:
  push:
    branches: [development]

permissions:
  id-token: write
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        env:
          ROLE: ${{ vars.DEPLOY_ROLE_ARN }}
        run: |
          if [ -n "$ROLE" ]; then echo "run=true" >> "$GITHUB_OUTPUT"
          else echo "run=false" >> "$GITHUB_OUTPUT"; echo "::notice::DEPLOY_ROLE_ARN not set — skipping deploy."; fi

  deploy:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    permissions:
      id-token: write
      contents: read
    uses: jubasjl76-eng/smart-pet-ci/.github/workflows/deploy-ecs.yml@main
    with:
      service: sensors
      task-family: smart-pet-dev-sensors
      container-name: sensors
      cluster: smart-pet-dev
      ecr-repo: smart-pet/sensors
      aws-region: ${{ vars.AWS_REGION }}
      role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
      run-migrations: false
